name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.0.1, etc.
  release:
    types: [published]  # Trigger when a release is published

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore PostOffice/PostOffice.csproj
      
    - name: Build
      run: dotnet build PostOffice/PostOffice.csproj --configuration Release --no-restore
      
    - name: Test
      run: dotnet test PostOffice.Tests/PostOffice.Tests.csproj --configuration Release --no-build --verbosity normal
      
    - name: Pack
      run: dotnet pack PostOffice/PostOffice.csproj --configuration Release --no-build --output ./nupkgs
      
    - name: Publish to NuGet
      run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }} 