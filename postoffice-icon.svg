<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#4A90E2" stroke="#357ABD" stroke-width="2"/>
  
  <!-- Mailbox base -->
  <rect x="35" y="70" width="58" height="35" rx="6" fill="#2C3E50"/>
  
  <!-- Mailbox body -->
  <rect x="32" y="45" width="64" height="35" rx="8" fill="#3498DB"/>
  <rect x="32" y="45" width="64" height="20" rx="8" fill="#5DADE2"/>
  
  <!-- Mailbox door -->
  <rect x="38" y="52" width="52" height="20" rx="4" fill="#2980B9" stroke="#1F618D" stroke-width="1"/>
  
  <!-- Mailbox handle -->
  <circle cx="84" cy="62" r="3" fill="#F39C12"/>
  
  <!-- Flag (up position - indicating mail!) -->
  <rect x="96" y="48" width="8" height="12" fill="#E74C3C"/>
  <polygon points="96,48 104,48 108,54 104,60 96,60" fill="#C0392B"/>
  
  <!-- Floating letters/envelopes -->
  <!-- Letter 1 -->
  <g transform="rotate(-15 20 30)">
    <rect x="15" y="25" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
    <polygon points="15,25 25,33 35,25" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
  </g>
  
  <!-- Letter 2 -->
  <g transform="rotate(20 110 35)">
    <rect x="105" y="30" width="18" height="12" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
    <polygon points="105,30 114,36 123,30" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
  </g>
  
  <!-- Letter 3 -->
  <g transform="rotate(-10 25 95)">
    <rect x="20" y="90" width="16" height="11" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
    <polygon points="20,90 28,95 36,90" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
  </g>
  
  <!-- Letter 4 -->
  <g transform="rotate(25 105 100)">
    <rect x="100" y="95" width="15" height="10" rx="2" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
    <polygon points="100,95 107.5,100 115,95" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
  </g>
  
  <!-- Cute sparkles -->
  <g fill="#F1C40F">
    <polygon points="25,60 27,64 31,62 27,66 25,70 23,66 19,62 23,64" opacity="0.8"/>
    <polygon points="100,75 101.5,77.5 104,76 101.5,78.5 100,81 98.5,78.5 96,76 98.5,77.5" opacity="0.8"/>
    <polygon points="45,25 46,27 48,26 46,28 45,30 44,28 42,26 44,27" opacity="0.8"/>
  </g>
  
  <!-- Mailbox post -->
  <rect x="58" y="80" width="12" height="25" fill="#2C3E50"/>
  <ellipse cx="64" cy="105" rx="8" ry="3" fill="#34495E"/>
</svg> 